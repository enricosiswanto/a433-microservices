version: "2"

services:
  item-app:
    image: ghcr.io/enricosiswanto/item-app:v1
    ports:
      - "80:8080"
    depends_on:
      - item-db
    restart: always  # Restart policy

  item-db:
    image: mongo:3
    volumes:
      - app-db:/data/db
    restart: always  # Restart policy

volumes:
  app-db:
